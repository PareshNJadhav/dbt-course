version: 2

models:
  - name: dim_listings_cleansed
    data_tests:
      - minimum_row_count:
          arguments:
            min_rows: 100
          severity: error
    columns:
      - name: listing_id
        description: "The unique identifier for a listing."
        data_tests:
          - not_null
          - unique

      - name: host_id
        description: "The unique identifier for a host."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        description: "The type of room being offered (e.g., entire home, private room, shared room)."
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - 'Entire home/apt'
                  - 'Private room'
                  - 'Shared room'
                  - 'Hotel room'

      - name: minimum_nights
        description: '{{ doc("dim_listing_cleansed__minimum_nights") }}'
        data_tests:
          - positive_values

  - name: dim_hosts_cleansed
    config:
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns:
          - host_id
    columns:
      - name: host_id
        description: "The unique identifier for a host."
        data_type: "integer"
        constraints:
          - type: not_null
          - type: unique
        data_tests:
          - not_null
          - unique

      - name: host_name
        description: "The name of the host."
        data_type: "string"
        data_tests:
          - not_null

      - name: is_superhost 
        description: "Indicates whether the host is a superhost."
        data_type: "string"
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - 't'
                  - 'f'
      
      - name: updated_at
        description: "The timestamp when the host record was last updated."
        data_type: "timestamp"
        
      - name: created_at
        description: "The timestamp when the host record was created."
        data_type: "timestamp"

        
  

  - name: fct_reviews

    columns:
      - name: listing_id
        description: "The unique identifier for a listing."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_listings_cleansed')
                field: listing_id

      - name: reviewer_name
        description: "The name of the reviewer."
        data_tests:
          - not_null

      - name: review_sentiment
        description: "The sentiment of the review (e.g., positive, negative, neutral)."
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - 'positive'
                  - 'negative'
                  - 'neutral'
                  
      